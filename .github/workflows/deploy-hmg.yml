name: BeeDay — HMG Deployment

on:
  workflow_run:
    workflows:
      - BeeDay CI
    types:
      - completed

  workflow_dispatch:

concurrency:
  group: beeday-homologation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    name: Deploy HMG
    # Automatic path: only deploy when the triggering BeeDay CI run succeeded on hmg specifically
    # AND was itself triggered by a push (not a pull_request). BeeDay CI still runs on both push
    # (post-merge, on hmg) and pull_request (validation, including the hmg->main promotion PR,
    # whose head_branch is also "hmg"). Before Sprint 19.6, both completions satisfied this guard
    # independently, producing two real deployments of the same state (confirmed with direct log
    # evidence in docs/deployment/06-cicd-pipeline-discovery-baseline.md #6/#12 - HMG Deploy
    # #57/#58 and #77/#78). Restricting to event == 'push' closes that path structurally: a
    # pull_request-triggered BeeDay CI run, even one with head_branch == 'hmg', can no longer
    # trigger a deployment. See docs/deployment/10-hmg-deployment-verification.md for the full
    # analysis of why this - not decoupling from BeeDay CI's workflow_run entirely - was chosen:
    # deployment still consumes artifacts BeeDay CI exclusively produces, and there is no
    # provenance mechanism yet (reserved for Sprint 19.8) to resolve them independently.
    # Manual path: workflow_dispatch has no workflow_run payload to gate on, so it's allowed
    # through — "controlled manual deploy" means a human deliberately running it, and the run
    # resolved below is still always the latest *successful* CI run on hmg, never an
    # arbitrary/broken one. A manual retry of the same SHA via workflow_dispatch is a deliberate
    # human action, not accidental duplication.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'hmg' &&
       github.event.workflow_run.event == 'push')

    runs-on:
      - self-hosted
      - Windows
      - X64
      - hmg

    timeout-minutes: 25
    environment: homologation

    outputs:
      deployed-sha: ${{ steps.resolve-sha.outputs.sha }}

    steps:
      # Checked out at the exact commit BeeDay CI validated — not the repository's default branch,
      # which is what a bare checkout would resolve to under a workflow_run event. Falls back to
      # github.sha (the ref picked at dispatch time) for the manual workflow_dispatch path.
      - name: Checkout deployment scripts
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Exposes the SHA this run actually deploys as a job output, consumed by verify-hmg.yml
      # (Sprint 19.6) to correlate readiness/smoke results back to the deployed state. Not read
      # from this job's own run metadata by a downstream workflow_run listener - that metadata
      # reflects the default branch at trigger time, not the deployed SHA (proven in
      # docs/deployment/06-cicd-pipeline-discovery-baseline.md #6.1). verify-hmg.yml instead reads
      # this value from the beeday-hmg-deployment-info artifact uploaded below.
      - name: Resolve deployed SHA
        id: resolve-sha
        shell: powershell
        run: |
          $sha = "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          Write-Host "Deployed SHA: $sha"
          "sha=$sha" >> $env:GITHUB_OUTPUT

      # Resolves which BeeDay CI run's artifact to deploy. workflow_run already carries the exact
      # run id in its payload. workflow_dispatch has no such payload, so it looks up the latest
      # *successful* BeeDay CI run on hmg via the REST API — never "the latest run of any kind."
      - name: Resolve BeeDay CI run to deploy
        id: resolve-run
        uses: actions/github-script@v9.0.0
        with:
          result-encoding: string
          script: |
            if (context.eventName === 'workflow_run') {
              core.info(`Using triggering workflow_run id ${context.payload.workflow_run.id}`);
              return `${context.payload.workflow_run.id}`;
            }

            core.info('workflow_dispatch: resolving latest successful BeeDay CI run on hmg');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'hmg',
              status: 'success',
              per_page: 1
            });

            if (runs.data.workflow_runs.length === 0) {
              throw new Error('No successful BeeDay CI run found on branch hmg.');
            }

            const runId = runs.data.workflow_runs[0].id;
            core.info(`Using latest successful BeeDay CI run id ${runId}`);
            return `${runId}`;

      # run-id pins this to the exact BeeDay CI execution resolved above — never the current run
      # (the default actions/download-artifact would otherwise assume), never "latest", never
      # another branch or commit.
      - name: Download validated publish artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: beeday-publish
          path: ${{ runner.temp }}\BeeDayPublish
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve-run.outputs.result }}

      # Same run-id as beeday-publish above - the migration bundle applied here must be the one
      # BeeDay CI built and validated alongside this exact publish artifact, never a different or
      # "latest" run.
      - name: Download validated migration bundle artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: beeday-migrations
          path: ${{ runner.temp }}\BeeDayMigrations
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve-run.outputs.result }}

      # SERV3WEB already has .NET SDK 10.0.302 provisioned machine-wide, so actions/setup-dotnet is
      # not used on this self-hosted job and must not be reintroduced: the runner executes as the
      # low-privilege svc_beeday_runner@lab.local service account, which must not receive
      # Write/Modify on C:\Program Files\dotnet, and setup-dotnet's attempt to install there is
      # exactly what made the deploy fail. Deploy-BeeDay.ps1 no longer shells out to `dotnet ef`
      # (migrations now run from the precompiled bundle downloaded above, which needs only the
      # shared .NET runtime, not the SDK or a project restore) - this step now exists because the
      # published application itself still needs the .NET runtime to run under IIS, so a
      # missing/wrong installation should still be caught here, not by a failing site.
      - name: Verify .NET SDK 10 is available
        shell: powershell
        run: |
          $dotnetCommand = Get-Command dotnet -ErrorAction SilentlyContinue
          if (-not $dotnetCommand) {
              throw "dotnet was not found on PATH. SERV3WEB must have the .NET SDK installed and available to the svc_beeday_runner account."
          }

          Write-Host "dotnet found at: $($dotnetCommand.Source)"

          $installedSdks = dotnet --list-sdks
          Write-Host "Installed SDKs:"
          $installedSdks | ForEach-Object { Write-Host "  $_" }

          $sdk10 = $installedSdks | Where-Object { $_ -match '^10\.0\.' } | Select-Object -First 1
          if (-not $sdk10) {
              throw "No .NET SDK 10.x was found on this runner."
          }

          Write-Host "Using .NET SDK: $sdk10"

      # Promotes scripts/iis-control/Invoke-BeeDayIisControl.ps1 (this checkout's copy) into
      # C:\Ops\BeeDay\IisControl\Invoke-BeeDayIisControl.ps1 via the \BeeDay\HMG-IisControl-Updater
      # Scheduled Task (SYSTEM) - the runner itself never writes into that privileged location. A
      # no-op (exits 0 without triggering the task) when the installed script's SHA-256 already
      # matches this checkout's copy. Runs BEFORE Deploy-BeeDay.ps1 and has no continue-on-error: if
      # promotion fails, this step fails and the job stops here - the deploy must never proceed
      # against a possibly-stale or possibly-inconsistent privileged control script. No secrets are
      # required or produced by this step.
      - name: Promote privileged IIS control script if changed
        shell: powershell
        run: |
          & ".\scripts\iis-control\Request-BeeDayIisControlPromotion.ps1" `
              -CommitSha "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

      - name: Deploy to IIS with rollback
        shell: powershell
        env:
          BEEDAY_PUBLIC_BASE_URL: ${{ secrets.BEEDAY_PUBLIC_BASE_URL }}
          BEEDAY_RESEND_API_KEY: ${{ secrets.BEEDAY_RESEND_API_KEY }}
          BEEDAY_RESEND_FROM_ADDRESS: ${{ secrets.BEEDAY_RESEND_FROM_ADDRESS }}
          BEEDAY_RESEND_FROM_NAME: ${{ secrets.BEEDAY_RESEND_FROM_NAME }}
          BEEDAY_ALLOWED_HOSTS: ${{ secrets.BEEDAY_ALLOWED_HOSTS }}
          BEEDAY_APP_CONNECTION: ${{ secrets.BEEDAY_APP_CONNECTION }}
          BEEDAY_MIGRATOR_CONNECTION: ${{ secrets.BEEDAY_MIGRATOR_CONNECTION }}
        run: |
          $publishPath = Join-Path "${{ runner.temp }}" "BeeDayPublish"
          $migrationBundlePath = Join-Path "${{ runner.temp }}" "BeeDayMigrations\efbundle.exe"

          & ".\scripts\Deploy-BeeDay.ps1" `
              -PublishPath $publishPath `
              -PublicBaseUrl $env:BEEDAY_PUBLIC_BASE_URL `
              -ResendApiKey $env:BEEDAY_RESEND_API_KEY `
              -ResendFromAddress $env:BEEDAY_RESEND_FROM_ADDRESS `
              -ResendFromName $env:BEEDAY_RESEND_FROM_NAME `
              -AllowedHosts $env:BEEDAY_ALLOWED_HOSTS `
              -SiteName "BeeDay-HMG" `
              -AppPoolName "BeeDay-Web-AppPool" `
              -DestinationPath "C:\Apps\BeeDay.Web" `
              -Environment "Homologation" `
              -HealthCheckUrl "https://h-beeday.com.br/health/ready" `
              -HealthCheckHostHeader "" `
              -AppConnectionString $env:BEEDAY_APP_CONNECTION `
              -RunMigrations `
              -MigrationBundlePath $migrationBundlePath `
              -MigrationConnectionString $env:BEEDAY_MIGRATOR_CONNECTION

      # Minimal deployment record (Sprint 19.6, Fase 14) - not the full observability platform
      # reserved for Sprint 19.9. Written only after Deploy-BeeDay.ps1 above returned successfully
      # (a step never runs after a prior step throws, so reaching here already means success).
      # The uploaded file is how verify-hmg.yml learns which SHA to verify - see the note on
      # "Resolve deployed SHA" above for why this artifact, not workflow_run head_sha metadata, is
      # the propagation mechanism.
      - name: Record deployment info
        shell: powershell
        run: |
          $info = [ordered]@{
            sha         = "${{ steps.resolve-sha.outputs.sha }}"
            workflowRun = "${{ github.run_id }}"
            result      = "success"
            environment = "homologation"
            timestampUtc = (Get-Date).ToUniversalTime().ToString("o")
          }

          New-Item -ItemType Directory -Path "${{ runner.temp }}\DeploymentInfo" -Force | Out-Null
          $infoPath = Join-Path "${{ runner.temp }}" "DeploymentInfo\deployment-info.json"
          $info | ConvertTo-Json | Set-Content -LiteralPath $infoPath

          "## BeeDay — HMG Deployment" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Source SHA | ``$($info.sha)`` |" >> $env:GITHUB_STEP_SUMMARY
          "| Workflow run | [$($info.workflowRun)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $env:GITHUB_STEP_SUMMARY
          "| Result | $($info.result) |" >> $env:GITHUB_STEP_SUMMARY
          "| Environment | $($info.environment) |" >> $env:GITHUB_STEP_SUMMARY
          "| Timestamp (UTC) | $($info.timestampUtc) |" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload deployment info
        uses: actions/upload-artifact@v7.0.1
        with:
          name: beeday-hmg-deployment-info
          path: ${{ runner.temp }}\DeploymentInfo
          if-no-files-found: error
          retention-days: 14
