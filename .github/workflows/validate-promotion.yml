name: Validate Promotion

# Policy gate only: proves a pull request follows the approved BeeDay promotion path
# (Sprint/fix -> hmg -> main -> prd) from a branch of this same repository, never a fork.
# It does not build, test, deploy, or modify the repository, and it does not replace or
# duplicate BeeDay CI (ci.yml).
on:
  pull_request:
    branches:
      - main
      - prd

concurrency:
  group: beeday-validate-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-promotion:
    name: Validate Promotion

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate promotion source branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          echo "Promotion pull request: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
          echo "Source repository: ${HEAD_REPO:-<none>}"

          # Branch names alone are not a trustworthy signal: a fork can name its own branch
          # "hmg" or "main" to imitate an internal promotion. Only a pull request whose head
          # repository is this same repository can be a legitimate promotion.
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Invalid promotion source repository '${HEAD_REPO:-<unknown>}'. Promotions into '${TARGET_BRANCH}' must come from a branch of this repository (${BASE_REPO}), not a fork."
            exit 1
          fi

          case "$TARGET_BRANCH" in
            main)
              if [ "$SOURCE_BRANCH" != "hmg" ]; then
                echo "::error::Invalid promotion path '${SOURCE_BRANCH} -> main'. Only 'hmg -> main' is an allowed promotion source."
                exit 1
              fi
              ;;
            prd)
              if [ "$SOURCE_BRANCH" != "main" ]; then
                echo "::error::Invalid promotion path '${SOURCE_BRANCH} -> prd'. Only 'main -> prd' is an allowed promotion source."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected target branch '${TARGET_BRANCH}' for Validate Promotion."
              exit 1
              ;;
          esac

          echo "Promotion path '${SOURCE_BRANCH} -> ${TARGET_BRANCH}' from '${HEAD_REPO}' is valid."
