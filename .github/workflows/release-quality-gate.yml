name: BeeDay — Release Quality Gate

# hmg -> main is a promotion boundary, not just another PR - CLAUDE.md's own promotion flow treats
# it as the fronteira where the highest validation rigor belongs, and where more time is an
# accepted trade-off. This workflow answers exactly one question: "does this state have enough
# quality to enter main?" - it never decides WHETHER a PR is a legitimate promotion (that remains
# BeeDay — Promotion Policy's job, validate-promotion.yml) and never deploys anything. Deliberately
# a full, independent re-validation of the code landing on main - not a reuse of hmg's BeeDay CI
# artifacts - because Build Once/Deploy Many across this boundary is explicitly out of scope until
# Sprint 19.8's provenance work; see docs/deployment/11-release-quality-gate.md.
on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: beeday-release-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Release Quality Gate

    # GitHub Actions' pull_request trigger can only filter by target (base) branch, not source
    # (head) branch - branches: [main] above already limits this to PRs targeting main, but any
    # source branch would match it. This job-level guard restricts actual execution to the one
    # legitimate promotion path (hmg -> main), consistent with (not a replacement for) what
    # BeeDay — Promotion Policy already enforces independently. A PR to main from anything other
    # than hmg still shows this check as never-reported, which - once main's Ruleset requires it -
    # blocks merge the same way an explicit rejection would (see docs/deployment/11-release-quality-gate.md
    # for why the Ruleset has NOT been updated yet).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'hmg'

    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"
          # Same native NuGet cache strategy as ci.yml (Sprint 19.5/19.5.1) - reused here because it
          # preserves determinism (cache miss falls back to a normal full restore; dotnet restore
          # below always runs regardless of hit/miss) while avoiding paying for the same download
          # twice within this gate's own execution.
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore dependencies
        shell: powershell
        run: dotnet restore BeeDay.slnx

      - name: Verify formatting
        shell: powershell
        run: dotnet format BeeDay.slnx --verify-no-changes --no-restore

      - name: Build solution (Release)
        shell: powershell
        run: |
          dotnet build BeeDay.slnx `
            --configuration Release `
            --no-restore `
            --warnaserror

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}

      - name: Install Playwright Chromium
        shell: powershell
        run: pwsh tests/BeeDay.E2E.Tests/bin/Release/net10.0/playwright.ps1 install chromium

      # Full suite, every project, including the 2 architecture/boundary tests embedded in
      # Domain.Tests/Application.Tests - the 19.3 matrix classified none of the 5 projects as
      # excludable from this boundary, and E2E stays REQUIRED here even though it is SELECTIVE
      # for Fast PR (docs/deployment/07-validation-matrix.md #15/#22). Same per-project invocation
      # pattern as ci.yml (unique .trx per project - see the comment there for why a single
      # `dotnet test BeeDay.slnx` call doesn't work).
      - name: Run full test suite
        shell: powershell
        run: |
          $testProjects = Get-ChildItem -Path "tests" -Filter "*.csproj" -Recurse
          $resultsDirectory = "${{ runner.temp }}\TestResults"
          $anyFailed = $false

          foreach ($project in $testProjects) {
              Write-Host "Running tests: $($project.Name)"

              dotnet test $project.FullName `
                --configuration Release `
                --no-build `
                --no-restore `
                --verbosity normal `
                --logger "trx;LogFileName=$($project.BaseName).trx" `
                --results-directory $resultsDirectory

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "FAILED: $($project.Name) (exit code $LASTEXITCODE)"
                  $anyFailed = $true
              }
          }

          if ($anyFailed) {
              throw "One or more test projects failed. See logs above for details."
          }

      # --no-build removed in Sprint 19.7.1 after empirical clean-state testing (Sprint 19.5.2's
      # finding applies here too, reconfirmed independently, not assumed): `dotnet build
      # BeeDay.slnx --configuration Release` above does not build the 4 src/ projects
      # (Domain/Application/Infrastructure/Web) in the Release configuration - it silently writes
      # them to bin/Debug + obj/Debug despite the flag, only the 5 test projects resolve Release
      # correctly. `dotnet publish --no-build` on a clean runner then fails with "Manifest file at
      # 'obj\Release\net10.0\staticwebassets.build.json' not found." Removing --no-build lets
      # publish perform its own implicit rebuild of its whole dependency graph, which - like a
      # direct single-project build - correctly resolves Release and produces every Release
      # output as a side effect, including the two steps below that also depend on
      # BeeDay.Infrastructure's Release build (see the note on those steps for why THEIR
      # --no-build was kept, not removed). See docs/deployment/11-release-quality-gate.md,
      # Sprint 19.7.1 section, for the full clean-state evidence.
      - name: Publish BeeDay
        shell: powershell
        run: |
          dotnet publish `
            ".\src\BeeDay.Web\BeeDay.Web.csproj" `
            --configuration Release `
            --no-restore `
            --output "${{ runner.temp }}\BeeDayPublish"

      - name: Validate published files
        shell: powershell
        run: |
          $publishPath = Join-Path "${{ runner.temp }}" "BeeDayPublish"
          $requiredFiles = @("BeeDay.Web.dll", "web.config")

          foreach ($file in $requiredFiles) {
              $fullPath = Join-Path $publishPath $file
              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Required published file was not found: $fullPath"
              }
          }

      - name: Restore EF Core tool (local, pinned)
        shell: powershell
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      # Closes the GAP the Sprint 19.3 matrix identified: documented in README.md's manual quality
      # gate checklist since before this EPIC, but never automated anywhere. Verified locally
      # before wiring this in (Sprint 19.7): exits 0 ("No changes have been made to the model since
      # the last migration") when the compiled model matches the last migration, and exits 1
      # ("Changes have been made to the model...") when it doesn't - confirmed with a temporary,
      # reverted-before-commit model change, never persisted. The connection string
      # BeeDayDbContextFactory falls back to is a placeholder never actually connected to (this
      # command only compares compiled models, like `migrations bundle` already does two steps
      # below - see the comment there).
      #
      # --no-build here is SAFE ONLY BECAUSE it runs after the Publish step above, not on its own
      # merit (Sprint 19.7.1 finding, empirically tested both ways): run in isolation right after
      # "Build solution (Release)" with no publish in between, this command fails with "The
      # specified deps.json [...\bin\Release\net10.0\BeeDay.Infrastructure.deps.json] does not
      # exist" - the same Debug-instead-of-Release solution-build defect that affected Publish
      # (see the note there), just surfacing as a different EF-tooling error message instead of
      # the StaticWebAssets one. Publish's own rebuild (now --no-build-free) produces
      # Infrastructure's Release output as a side effect before this step runs, which is what
      # makes --no-build safe to keep here. This coupling is intentional, not hidden: do not
      # reorder this step to run before Publish.
      - name: Check for pending EF model changes
        shell: powershell
        run: |
          dotnet ef migrations has-pending-model-changes `
            --project src\BeeDay.Infrastructure `
            --startup-project src\BeeDay.Infrastructure `
            --configuration Release `
            --no-build

      # Same "SAFE ONLY AFTER PUBLISH" coupling as the pending-model-changes step above (Sprint
      # 19.7.1, empirically confirmed): --no-build here depends on Publish's implicit rebuild
      # having already produced BeeDay.Infrastructure's Release output. Tested isolated
      # (immediately after "Build solution (Release)", no publish in between) and it fails with
      # the same missing-deps.json error. Do not reorder this step to run before Publish.
      - name: Generate EF Core migration bundle (win-x64)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "${{ runner.temp }}\BeeDayMigrations" -Force | Out-Null

          dotnet ef migrations bundle `
            --project "src\BeeDay.Infrastructure\BeeDay.Infrastructure.csproj" `
            --startup-project "src\BeeDay.Infrastructure\BeeDay.Infrastructure.csproj" `
            --configuration Release `
            --no-build `
            --target-runtime win-x64 `
            --output "${{ runner.temp }}\BeeDayMigrations\efbundle.exe" `
            --force

      - name: Validate migration bundle
        shell: powershell
        run: |
          $bundlePath = Join-Path "${{ runner.temp }}" "BeeDayMigrations\efbundle.exe"
          if (-not (Test-Path -LiteralPath $bundlePath -PathType Leaf)) {
              throw "Migration bundle was not found: $bundlePath"
          }

          & $bundlePath --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
              throw "Migration bundle exists but failed to execute (exit code $LASTEXITCODE)."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: beeday-release-gate-test-results
          path: ${{ runner.temp }}\TestResults
          if-no-files-found: warn
          retention-days: 14

      # EPIC 30 Sprint 30.24 (test-engineering audit): E2ETestBase already captures a screenshot +
      # Playwright trace on every failing E2E test (tests/BeeDay.E2E.Tests/E2ETestBase.cs), saved
      # under the test project's own build output, not under ${{ runner.temp }}\TestResults above -
      # so this is the only workflow that runs E2E.Tests (ci.yml's Fast PR gate does not) and, until
      # now, the only place a real CI-triggered E2E failure's diagnostic artifacts were silently
      # discarded when the runner was torn down. Passing tests produce no files here at all, so
      # if-no-files-found is ignore, not warn - an empty upload on a fully green run is expected, not
      # a problem to flag.
      - name: Upload E2E failure artifacts (screenshots/traces)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: beeday-e2e-failure-artifacts
          path: tests\BeeDay.E2E.Tests\bin\Release\net10.0\e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

      # Minimal summary (Sprint 19.7, Fase 27) - not the full observability platform reserved for
      # Sprint 19.9. Written last, after every prior step already succeeded (a step never runs
      # after an earlier one throws), so reaching here means the whole gate passed.
      #
      # ASCII hyphen, not an em dash (Sprint 19.8.2): the identical defect confirmed remotely in
      # deploy-hmg.yml's "Record deployment info" step (Sprint 19.8.1, run 31456637128) and
      # reproduced locally here with this exact literal - an em dash inside a PowerShell
      # double-quoted string written to a temp .ps1 file gets misdecoded by Windows PowerShell 5.1
      # (confirmed to be the actual shell here too: windows-latest's `shell: powershell` resolves
      # to the same C:\Windows\System32\WindowsPowerShell\v1.0\powershell.EXE binary as the
      # self-hosted HMG runner, verified from a real ci.yml run's log) when the file has no BOM,
      # producing a mojibake "smart quote" character that PS 5.1's tokenizer treats as a string
      # terminator. Fixed here proactively, before this gate's first real hmg->main execution -
      # see docs/deployment/11-release-quality-gate.md, Sprint 19.8.2 section.
      - name: Record gate summary
        if: always()
        shell: powershell
        run: |
          "## BeeDay - Release Quality Gate" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Source SHA | ``${{ github.event.pull_request.head.sha || github.sha }}`` |" >> $env:GITHUB_STEP_SUMMARY
          "| PR | ${{ github.event.pull_request.number && format('#{0}', github.event.pull_request.number) || 'workflow_dispatch' }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Source branch | ${{ github.event.pull_request.head.ref || github.ref_name }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Target branch | ${{ github.event.pull_request.base.ref || 'main' }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Result | ${{ job.status }} |" >> $env:GITHUB_STEP_SUMMARY
