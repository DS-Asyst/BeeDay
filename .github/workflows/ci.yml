name: BeeDay CI

on:
  push:
    branches:
      - hmg

  pull_request:
    branches:
      - hmg
      - prd

  workflow_dispatch:

concurrency:
  group: beeday-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Restore, Build, Test and Publish

    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET information
        shell: powershell
        run: dotnet --info

      - name: Restore dependencies
        shell: powershell
        run: dotnet restore BeeDay.slnx

      - name: Verify formatting
        shell: powershell
        run: dotnet format BeeDay.slnx --verify-no-changes --no-restore

      - name: Build solution
        shell: powershell
        run: |
          dotnet build BeeDay.slnx `
            --configuration Release `
            --no-restore `
            --warnaserror

      - name: Install Playwright Chromium
        shell: powershell
        run: pwsh tests/BeeDay.E2E.Tests/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Run tests
        shell: powershell
        run: |
          # Each test project is invoked individually (instead of `dotnet test BeeDay.slnx` as a
          # single call) so each gets its own uniquely named .trx via LogFileName. Running the
          # whole solution in one call makes every project's test host share the same file name,
          # which caused "WARNING: Overwriting results file". All projects still run to completion
          # regardless of earlier failures, and the step throws (failing the job) if any failed -
          # no continue-on-error, no swallowed exit codes.
          $testProjects = Get-ChildItem -Path "tests" -Filter "*.csproj" -Recurse
          $resultsDirectory = "${{ runner.temp }}\TestResults"
          $anyFailed = $false

          foreach ($project in $testProjects) {
              Write-Host "Running tests: $($project.Name)"

              dotnet test $project.FullName `
                --configuration Release `
                --no-build `
                --verbosity normal `
                --logger "trx;LogFileName=$($project.BaseName).trx" `
                --results-directory $resultsDirectory

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "FAILED: $($project.Name) (exit code $LASTEXITCODE)"
                  $anyFailed = $true
              }
          }

          if ($anyFailed) {
              throw "One or more test projects failed. See logs above for details."
          }

      - name: Publish BeeDay
        shell: powershell
        run: |
          dotnet publish `
            ".\src\BeeDay.Web\BeeDay.Web.csproj" `
            --configuration Release `
            --no-restore `
            --output "${{ runner.temp }}\BeeDayPublish"

      - name: Validate published files
        shell: powershell
        run: |
          $publishPath = Join-Path "${{ runner.temp }}" "BeeDayPublish"
          $requiredFiles = @("BeeDay.Web.dll", "web.config")

          foreach ($file in $requiredFiles) {
              $fullPath = Join-Path $publishPath $file
              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Required published file was not found: $fullPath"
              }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beeday-test-results
          path: ${{ runner.temp }}\TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Upload E2E failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beeday-e2e-artifacts
          path: tests\BeeDay.E2E.Tests\bin\Release\net10.0\e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload validated publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: beeday-publish
          path: ${{ runner.temp }}\BeeDayPublish
          if-no-files-found: error
          retention-days: 7
