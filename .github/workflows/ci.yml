name: LevelUp CI

on:
  push:
    branches:
      - hmg

  pull_request:
    branches:
      - hmg
      - prd

  workflow_dispatch:

concurrency:
  group: levelup-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Restore, Build, Test and Publish

    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET information
        shell: powershell
        run: dotnet --info

      - name: Restore dependencies
        shell: powershell
        run: dotnet restore LevelUp.slnx

      - name: Verify formatting
        shell: powershell
        run: dotnet format LevelUp.slnx --verify-no-changes --no-restore

      - name: Build solution
        shell: powershell
        run: |
          dotnet build LevelUp.slnx `
            --configuration Release `
            --no-restore `
            --warnaserror

      - name: Run tests
        shell: powershell
        run: |
          dotnet test LevelUp.slnx `
            --configuration Release `
            --no-build `
            --verbosity normal `
            --logger "trx;LogFileName=levelup-tests.trx" `
            --results-directory "${{ runner.temp }}\TestResults"

      - name: Publish LevelUp
        shell: powershell
        run: |
          dotnet publish `
            ".\src\LevelUp.Web\LevelUp.Web.csproj" `
            --configuration Release `
            --no-build `
            --output "${{ runner.temp }}\LevelUpPublish"

      - name: Validate published files
        shell: powershell
        run: |
          $publishPath = Join-Path "${{ runner.temp }}" "LevelUpPublish"
          $requiredFiles = @("LevelUp.Web.dll", "web.config")

          foreach ($file in $requiredFiles) {
              $fullPath = Join-Path $publishPath $file
              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Required published file was not found: $fullPath"
              }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levelup-test-results
          path: ${{ runner.temp }}\TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Upload validated publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: levelup-publish
          path: ${{ runner.temp }}\LevelUpPublish
          if-no-files-found: error
          retention-days: 7
