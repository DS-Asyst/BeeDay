name: BeeDay CI

on:
  # Kept deliberately, not legacy: Sprint 19.6 re-evaluated this trigger and decided NOT to remove
  # it. BeeDay — HMG Deployment (deploy-hmg.yml) still consumes the beeday-publish/beeday-migrations
  # artifacts this push-triggered run produces, and no provenance mechanism exists yet (reserved
  # for Sprint 19.8) to let deployment resolve them independently of a CI run on this exact push.
  # What Sprint 19.6 DID fix is the duplicate-deployment consequence of also keeping
  # pull_request -> main below: deploy-hmg.yml's guard now requires the triggering BeeDay CI run's
  # own event to have been 'push', so the hmg->main promotion PR's BeeDay CI run (pull_request,
  # head_branch also 'hmg') can no longer independently trigger a second deployment of the same
  # state. See docs/deployment/10-hmg-deployment-verification.md.
  push:
    branches:
      - hmg

  pull_request:
    branches:
      - hmg
      - main
    # prd intentionally excluded: no Ruleset on prd requires "BeeDay CI" (or any check), and
    # nothing downstream consumes a ci.yml run triggered by a main->prd PR - deploy-prd.yml
    # verifies provenance back to hmg's own BeeDay CI run independently (see deploy-prd.yml).
    # Running the full build+test suite again here was pure waste with zero required-check
    # consumer. Sprint 19.4 (EPIC 19) - see docs/deployment/08-fast-pr-validation-decision.md.

  workflow_dispatch:

concurrency:
  group: beeday-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: BeeDay CI

    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"
          # Native NuGet cache (backed by actions/cache internally), not a hand-rolled
          # actions/cache step - see docs/deployment/09-pipeline-performance.md (Sprint 19.5) for
          # why setup-dotnet's own cache was chosen over a manual one, and why this is safe with
          # no packages.lock.json in the repo (Central Package Management already pins exact
          # versions via Directory.Packages.props; cache miss falls back to a normal full
          # restore, never a functional requirement for correctness).
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Show .NET information
        shell: powershell
        run: dotnet --info

      - name: Restore dependencies
        shell: powershell
        run: dotnet restore BeeDay.slnx

      - name: Verify formatting
        shell: powershell
        run: dotnet format BeeDay.slnx --verify-no-changes --no-restore

      - name: Build solution
        shell: powershell
        run: |
          dotnet build BeeDay.slnx `
            --configuration Release `
            --no-restore `
            --warnaserror

      # Path confirmed empirically from a real run's install log (Sprint 19.5): Playwright's .NET
      # tool installs Chromium/FFmpeg to %LOCALAPPDATA%\ms-playwright on windows-latest, unrelated
      # to the NuGet cache above. Keyed on Microsoft.Playwright's pinned version in
      # Directory.Packages.props, so a version bump invalidates the cache automatically. Safe on
      # cache miss: the install step below still runs unconditionally and re-downloads if needed.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}

      - name: Install Playwright Chromium
        shell: powershell
        run: pwsh tests/BeeDay.E2E.Tests/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Run tests
        shell: powershell
        run: |
          # Each test project is invoked individually (instead of `dotnet test BeeDay.slnx` as a
          # single call) so each gets its own uniquely named .trx via LogFileName. Running the
          # whole solution in one call makes every project's test host share the same file name,
          # which caused "WARNING: Overwriting results file". All projects still run to completion
          # regardless of earlier failures, and the step throws (failing the job) if any failed -
          # no continue-on-error, no swallowed exit codes.
          $testProjects = Get-ChildItem -Path "tests" -Filter "*.csproj" -Recurse
          $resultsDirectory = "${{ runner.temp }}\TestResults"
          $anyFailed = $false

          foreach ($project in $testProjects) {
              Write-Host "Running tests: $($project.Name)"

              dotnet test $project.FullName `
                --configuration Release `
                --no-build `
                --no-restore `
                --verbosity normal `
                --logger "trx;LogFileName=$($project.BaseName).trx" `
                --results-directory $resultsDirectory

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "FAILED: $($project.Name) (exit code $LASTEXITCODE)"
                  $anyFailed = $true
              }
          }

          if ($anyFailed) {
              throw "One or more test projects failed. See logs above for details."
          }

      # --no-build added in Sprint 19.5: dotnet publish re-evaluates/re-links the whole dependency
      # graph (Domain/Application/Infrastructure/Web) by default even though the Release build
      # above already produced identical, up-to-date outputs with the same configuration and no
      # source changes in between - measured locally at ~13s (rebuild) vs ~2s (--no-build) for the
      # same publish, see docs/deployment/09-pipeline-performance.md.
      - name: Publish BeeDay
        shell: powershell
        run: |
          dotnet publish `
            ".\src\BeeDay.Web\BeeDay.Web.csproj" `
            --configuration Release `
            --no-restore `
            --no-build `
            --output "${{ runner.temp }}\BeeDayPublish"

      - name: Validate published files
        shell: powershell
        run: |
          $publishPath = Join-Path "${{ runner.temp }}" "BeeDayPublish"
          $requiredFiles = @("BeeDay.Web.dll", "web.config")

          foreach ($file in $requiredFiles) {
              $fullPath = Join-Path $publishPath $file
              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Required published file was not found: $fullPath"
              }
          }

      # dotnet-ef is restored as a LOCAL tool pinned by dotnet-tools.json - never installed
      # globally - so the exact EF Core CLI version the repo declares is the version that builds
      # the bundle below.
      - name: Restore EF Core tool (local, pinned)
        shell: powershell
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      # A migration bundle is a self-sufficient executable: it embeds the compiled migrations and
      # model, so running it later requires no MSBuild project load, no project.assets.json, and no
      # NuGet access at all - unlike `dotnet ef database update`, which needs the Infrastructure
      # project restored to run. --no-build reuses the Release build already produced above (Build
      # Once). --target-runtime win-x64 without --self-contained keeps it framework-dependent: the
      # deploy target already has the .NET 10 runtime installed, so bundling a full runtime copy
      # would only add size for no benefit. BeeDayDbContextFactory's connection string is a
      # placeholder never actually connected to at bundle-build time (EF only reflects over the
      # already-compiled migrations here), so no secret is involved in producing this artifact.
      - name: Generate EF Core migration bundle (win-x64)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "${{ runner.temp }}\BeeDayMigrations" -Force | Out-Null

          dotnet ef migrations bundle `
            --project "src\BeeDay.Infrastructure\BeeDay.Infrastructure.csproj" `
            --startup-project "src\BeeDay.Infrastructure\BeeDay.Infrastructure.csproj" `
            --configuration Release `
            --no-build `
            --target-runtime win-x64 `
            --output "${{ runner.temp }}\BeeDayMigrations\efbundle.exe" `
            --force

      - name: Validate migration bundle
        shell: powershell
        run: |
          $bundlePath = Join-Path "${{ runner.temp }}" "BeeDayMigrations\efbundle.exe"
          if (-not (Test-Path -LiteralPath $bundlePath -PathType Leaf)) {
              throw "Migration bundle was not found: $bundlePath"
          }

          # --help never touches a database - this only proves the produced executable actually
          # runs on this runner's architecture and isn't corrupt, without needing any connection
          # string.
          & $bundlePath --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
              throw "Migration bundle exists but failed to execute (exit code $LASTEXITCODE)."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: beeday-test-results
          path: ${{ runner.temp }}\TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Upload E2E failure artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: beeday-e2e-artifacts
          path: tests\BeeDay.E2E.Tests\bin\Release\net10.0\e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload validated publish artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: beeday-publish
          path: ${{ runner.temp }}\BeeDayPublish
          if-no-files-found: error
          retention-days: 7

      - name: Upload migration bundle artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: beeday-migrations
          path: ${{ runner.temp }}\BeeDayMigrations
          if-no-files-found: error
          retention-days: 7
