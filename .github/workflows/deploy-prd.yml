name: BeeDay — Production Deployment

on:
  push:
    branches:
      - prd

  workflow_dispatch:

concurrency:
  group: beeday-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    name: Deploy Production
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 25
    environment: production

    env:
      BEEDAY_PUBLIC_BASE_URL: ${{ secrets.BEEDAY_PUBLIC_BASE_URL }}
      BEEDAY_RESEND_API_KEY: ${{ secrets.BEEDAY_RESEND_API_KEY }}
      BEEDAY_RESEND_FROM_ADDRESS: ${{ secrets.BEEDAY_RESEND_FROM_ADDRESS }}
      BEEDAY_RESEND_FROM_NAME: ${{ secrets.BEEDAY_RESEND_FROM_NAME }}
      BEEDAY_ALLOWED_HOSTS: ${{ secrets.BEEDAY_ALLOWED_HOSTS }}

    steps:
      # actions/checkout stays pinned at v4 here (unlike ci.yml and deploy-hmg.yml) because it runs
      # on the production self-hosted runner, whose GitHub Actions Runner version has not yet been
      # confirmed to meet the Node 24 requirement (checkout v5+ needs Runner >= 2.327.1). Bump once
      # that runner is validated - see the same note on the github-script and download-artifact
      # steps below.
      - name: Checkout deployment scripts
        uses: actions/checkout@v7

      # Build Once, Deploy Many across hmg -> main -> prd: prd is promoted from main exclusively
      # via pull request, and main is promoted from hmg exclusively via pull request (per the
      # project's promotion policy, enforced by the Validate Promotion workflow). The commit that
      # lands on prd is therefore two promotion hops away from the commit BeeDay CI actually built
      # and tested on hmg. A pull request's head SHA always identifies the real source-branch
      # commit regardless of which merge method (merge commit, squash, or rebase) landed it on the
      # target branch, so we walk that chain hop by hop instead of assuming SHA equality anywhere:
      #   1. resolve the main -> prd pull request that introduced the commit pushed to prd, and
      #      read its head SHA (main's tip at promotion time);
      #   2. resolve the hmg -> main pull request associated with that main commit, and read its
      #      head SHA (hmg's tip at promotion time - the exact commit BeeDay CI built and tested);
      #   3. require a successful BeeDay CI run on hmg for that exact head SHA.
      # If any link in that chain is missing, this fails closed - no artifact is downloaded and
      # nothing is deployed. No artifact is ever rebuilt: the one BeeDay CI produced on hmg is the
      # one deployed to both HMG and PRD.
      #
      # Stays pinned at v7 for the same runner-validation reason as the checkout step above -
      # github-script v8+ also requires Runner >= 2.327.1. Our script only uses the injected
      # `github`/`core` objects (no `require('@actions/github')`, no redeclared `getOctokit`), so
      # it is already forward-compatible with v9's breaking changes whenever the bump happens.
      - name: Resolve validated BeeDay CI run for this production commit
        id: resolve-run
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const commitSha = context.sha;
            core.info(`Resolving originating pull request for production commit ${commitSha}`);

            const prdPrs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha
            });

            const mainToPrdPr = prdPrs.data.find(
              (pr) => pr.base.ref === 'prd' && pr.head.ref === 'main'
            );

            if (!mainToPrdPr) {
              core.setFailed(
                `No main -> prd pull request found for commit ${commitSha}. ` +
                'Refusing to deploy: cannot prove this commit was promoted from main.'
              );
              return '';
            }

            const mainHeadSha = mainToPrdPr.head.sha;
            core.info(`Originating PR #${mainToPrdPr.number}: main head_sha ${mainHeadSha}`);

            const mainPrs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: mainHeadSha
            });

            const hmgToMainPr = mainPrs.data.find(
              (pr) => pr.base.ref === 'main' && pr.head.ref === 'hmg'
            );

            if (!hmgToMainPr) {
              core.setFailed(
                `No hmg -> main pull request found for main commit ${mainHeadSha}. ` +
                'Refusing to deploy: cannot trace this promotion back to a validated hmg commit.'
              );
              return '';
            }

            const validatedHeadSha = hmgToMainPr.head.sha;
            core.info(`Originating PR #${hmgToMainPr.number}: hmg head_sha ${validatedHeadSha}`);

            // Paginates through every successful BeeDay CI run on hmg instead of trusting a single
            // 100-run page - a promotion PR opened well after its hmg commit was validated (or a
            // busy hmg branch with >100 successful runs since) must still resolve correctly. Scans
            // newest-first and stops at the first match. maxPages is a defensive cap (2000 runs)
            // against an unbounded scan burning through API rate limits if head_sha is somehow
            // never found - not a "first N runs" shortcut, since a real match is found the moment
            // its page is reached, however far back that is within the cap.
            const maxPages = 20;
            const iterator = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'hmg',
              status: 'success',
              per_page: 100
            });

            let matchingRun = null;
            let pagesScanned = 0;

            for await (const response of iterator) {
              pagesScanned++;
              matchingRun = response.data.find((run) => run.head_sha === validatedHeadSha);
              if (matchingRun || pagesScanned >= maxPages) {
                break;
              }
            }

            if (!matchingRun) {
              core.setFailed(
                `No successful BeeDay CI run found on hmg for head_sha ${validatedHeadSha} ` +
                `within the ${pagesScanned * 100} most recent successful runs scanned. ` +
                'Refusing to deploy: the promoted commit cannot be traced to a green BeeDay CI run.'
              );
              return '';
            }

            core.info(`Using validated BeeDay CI run id ${matchingRun.id} (head_sha ${matchingRun.head_sha})`);
            return `${matchingRun.id}`;

      # run-id pins this to the exact BeeDay CI execution resolved above - never "latest", never
      # a rebuild, never another branch or commit. This is the same artifact already deployed to
      # HMG.
      #
      # Stays pinned at v4 for the same runner-validation reason as the checkout step above -
      # download-artifact v5+ also requires Runner >= 2.327.1.
      - name: Download validated publish artifact
        uses: actions/download-artifact@v4
        with:
          name: beeday-publish
          path: ${{ runner.temp }}\BeeDayPublish
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve-run.outputs.result }}

      - name: Validate deployment secrets
        shell: powershell
        run: |
          $required = @{
              BEEDAY_PUBLIC_BASE_URL = $env:BEEDAY_PUBLIC_BASE_URL
              BEEDAY_RESEND_API_KEY = $env:BEEDAY_RESEND_API_KEY
              BEEDAY_RESEND_FROM_ADDRESS = $env:BEEDAY_RESEND_FROM_ADDRESS
              BEEDAY_RESEND_FROM_NAME = $env:BEEDAY_RESEND_FROM_NAME
              BEEDAY_ALLOWED_HOSTS = $env:BEEDAY_ALLOWED_HOSTS
          }

          foreach ($entry in $required.GetEnumerator()) {
              if ([string]::IsNullOrWhiteSpace($entry.Value)) {
                  throw "Required GitHub secret is missing: $($entry.Key)"
              }
          }

          if (-not $env:BEEDAY_PUBLIC_BASE_URL.StartsWith("https://", [StringComparison]::OrdinalIgnoreCase)) {
              throw "BEEDAY_PUBLIC_BASE_URL must use HTTPS."
          }

      - name: Deploy to IIS with rollback
        shell: powershell
        run: |
          $publishPath = Join-Path "${{ runner.temp }}" "BeeDayPublish"

          & ".\scripts\Deploy-BeeDay.ps1" `
              -PublishPath $publishPath `
              -PublicBaseUrl $env:BEEDAY_PUBLIC_BASE_URL `
              -ResendApiKey $env:BEEDAY_RESEND_API_KEY `
              -ResendFromAddress $env:BEEDAY_RESEND_FROM_ADDRESS `
              -ResendFromName $env:BEEDAY_RESEND_FROM_NAME `
              -AllowedHosts $env:BEEDAY_ALLOWED_HOSTS
