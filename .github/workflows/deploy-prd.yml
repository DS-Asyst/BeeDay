name: BeeDay Production Deploy

on:
  push:
    branches:
      - prd

  workflow_dispatch:

concurrency:
  group: beeday-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Validate Production Artifact

    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        shell: powershell
        run: dotnet restore BeeDay.slnx

      - name: Verify formatting
        shell: powershell
        run: dotnet format BeeDay.slnx --verify-no-changes --no-restore

      - name: Build solution
        shell: powershell
        run: |
          dotnet build BeeDay.slnx `
            --configuration Release `
            --no-restore `
            --warnaserror

      - name: Run tests
        shell: powershell
        run: |
          dotnet test BeeDay.slnx `
            --configuration Release `
            --no-build `
            --verbosity normal `
            --logger "trx;LogFileName=beeday-tests.trx" `
            --results-directory "${{ runner.temp }}\TestResults"

      - name: Publish BeeDay
        shell: powershell
        run: |
          dotnet publish `
            ".\src\BeeDay.Web\BeeDay.Web.csproj" `
            --configuration Release `
            --no-build `
            --output "${{ runner.temp }}\BeeDayPublish"

      - name: Validate published files
        shell: powershell
        run: |
          $publishPath = Join-Path "${{ runner.temp }}" "BeeDayPublish"
          $requiredFiles = @("BeeDay.Web.dll", "web.config")

          foreach ($file in $requiredFiles) {
              $fullPath = Join-Path $publishPath $file
              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Required published file was not found: $fullPath"
              }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beeday-production-test-results
          path: ${{ runner.temp }}\TestResults
          if-no-files-found: warn
          retention-days: 30

      - name: Upload validated production artifact
        uses: actions/upload-artifact@v4
        with:
          name: beeday-production-publish
          path: ${{ runner.temp }}\BeeDayPublish
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to SERV3-WEB1
    needs: validate

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Download validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: beeday-production-publish
          path: ${{ runner.temp }}\BeeDayPublish

      - name: Validate deployment secrets
        shell: powershell
        env:
          BEEDAY_PUBLIC_BASE_URL: ${{ secrets.BEEDAY_PUBLIC_BASE_URL }}
          BEEDAY_RESEND_API_KEY: ${{ secrets.BEEDAY_RESEND_API_KEY }}
          BEEDAY_RESEND_FROM_ADDRESS: ${{ secrets.BEEDAY_RESEND_FROM_ADDRESS }}
          BEEDAY_ALLOWED_HOSTS: ${{ secrets.BEEDAY_ALLOWED_HOSTS }}
        run: |
          $required = @{
              BEEDAY_PUBLIC_BASE_URL = $env:BEEDAY_PUBLIC_BASE_URL
              BEEDAY_RESEND_API_KEY = $env:BEEDAY_RESEND_API_KEY
              BEEDAY_RESEND_FROM_ADDRESS = $env:BEEDAY_RESEND_FROM_ADDRESS
              BEEDAY_ALLOWED_HOSTS = $env:BEEDAY_ALLOWED_HOSTS
          }

          foreach ($entry in $required.GetEnumerator()) {
              if ([string]::IsNullOrWhiteSpace($entry.Value)) {
                  throw "Required GitHub secret is missing: $($entry.Key)"
              }
          }

          if (-not $env:BEEDAY_PUBLIC_BASE_URL.StartsWith("https://", [StringComparison]::OrdinalIgnoreCase)) {
              throw "BEEDAY_PUBLIC_BASE_URL must use HTTPS."
          }

      - name: Deploy to IIS with rollback
        shell: powershell
        env:
          BEEDAY_PUBLIC_BASE_URL: ${{ secrets.BEEDAY_PUBLIC_BASE_URL }}
          BEEDAY_RESEND_API_KEY: ${{ secrets.BEEDAY_RESEND_API_KEY }}
          BEEDAY_RESEND_FROM_ADDRESS: ${{ secrets.BEEDAY_RESEND_FROM_ADDRESS }}
          BEEDAY_RESEND_FROM_NAME: ${{ secrets.BEEDAY_RESEND_FROM_NAME }}
          BEEDAY_ALLOWED_HOSTS: ${{ secrets.BEEDAY_ALLOWED_HOSTS }}
        run: |
          $publishPath = Join-Path "${{ runner.temp }}" "BeeDayPublish"

          & ".\scripts\Deploy-BeeDay.ps1" `
              -PublishPath $publishPath `
              -PublicBaseUrl $env:BEEDAY_PUBLIC_BASE_URL `
              -ResendApiKey $env:BEEDAY_RESEND_API_KEY `
              -ResendFromAddress $env:BEEDAY_RESEND_FROM_ADDRESS `
              -ResendFromName $env:BEEDAY_RESEND_FROM_NAME `
              -AllowedHosts $env:BEEDAY_ALLOWED_HOSTS
