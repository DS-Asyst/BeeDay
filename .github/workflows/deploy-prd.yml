name: BeeDay Production Deploy

on:
  push:
    branches:
      - prd

  workflow_dispatch:

concurrency:
  group: beeday-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    name: Deploy to SERV3-WEB1
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      # Build Once, Deploy Many: prd is promoted from hmg exclusively via pull request (per the
      # project's promotion policy), so the commit that lands on prd is a merge/squash commit with
      # a different SHA than anything BeeDay CI ever built. To prove this commit was actually
      # validated, we trace it back to the hmg -> prd pull request that introduced it, read that
      # PR's hmg head_sha (the exact commit BeeDay CI built and tested), and require a successful
      # BeeDay CI run on hmg for that exact head_sha. If any link in that chain is missing, this
      # fails closed - no artifact is downloaded and nothing is deployed.
      - name: Resolve validated BeeDay CI run for this production commit
        id: resolve-run
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const commitSha = context.sha;
            core.info(`Resolving originating pull request for production commit ${commitSha}`);

            const prsForCommit = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha
            });

            const originatingPr = prsForCommit.data.find(
              (pr) => pr.base.ref === 'prd' && pr.head.ref === 'hmg'
            );

            if (!originatingPr) {
              core.setFailed(
                `No hmg -> prd pull request found for commit ${commitSha}. ` +
                'Refusing to deploy: cannot prove this commit was validated by BeeDay CI.'
              );
              return '';
            }

            const validatedHeadSha = originatingPr.head.sha;
            core.info(`Originating PR #${originatingPr.number}: hmg head_sha ${validatedHeadSha}`);

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'hmg',
              status: 'success',
              per_page: 100
            });

            const matchingRun = runs.data.workflow_runs.find(
              (run) => run.head_sha === validatedHeadSha
            );

            if (!matchingRun) {
              core.setFailed(
                `No successful BeeDay CI run found on hmg for head_sha ${validatedHeadSha}. ` +
                'Refusing to deploy: the promoted commit cannot be traced to a green BeeDay CI run.'
              );
              return '';
            }

            core.info(`Using validated BeeDay CI run id ${matchingRun.id} (head_sha ${matchingRun.head_sha})`);
            return `${matchingRun.id}`;

      # run-id pins this to the exact BeeDay CI execution resolved above - never "latest", never
      # a rebuild, never another branch or commit. This is the same artifact already deployed to
      # HMG.
      - name: Download validated publish artifact
        uses: actions/download-artifact@v4
        with:
          name: beeday-publish
          path: ${{ runner.temp }}\BeeDayPublish
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve-run.outputs.result }}

      - name: Validate deployment secrets
        shell: powershell
        env:
          BEEDAY_PUBLIC_BASE_URL: ${{ secrets.BEEDAY_PUBLIC_BASE_URL }}
          BEEDAY_RESEND_API_KEY: ${{ secrets.BEEDAY_RESEND_API_KEY }}
          BEEDAY_RESEND_FROM_ADDRESS: ${{ secrets.BEEDAY_RESEND_FROM_ADDRESS }}
          BEEDAY_ALLOWED_HOSTS: ${{ secrets.BEEDAY_ALLOWED_HOSTS }}
        run: |
          $required = @{
              BEEDAY_PUBLIC_BASE_URL = $env:BEEDAY_PUBLIC_BASE_URL
              BEEDAY_RESEND_API_KEY = $env:BEEDAY_RESEND_API_KEY
              BEEDAY_RESEND_FROM_ADDRESS = $env:BEEDAY_RESEND_FROM_ADDRESS
              BEEDAY_ALLOWED_HOSTS = $env:BEEDAY_ALLOWED_HOSTS
          }

          foreach ($entry in $required.GetEnumerator()) {
              if ([string]::IsNullOrWhiteSpace($entry.Value)) {
                  throw "Required GitHub secret is missing: $($entry.Key)"
              }
          }

          if (-not $env:BEEDAY_PUBLIC_BASE_URL.StartsWith("https://", [StringComparison]::OrdinalIgnoreCase)) {
              throw "BEEDAY_PUBLIC_BASE_URL must use HTTPS."
          }

      - name: Deploy to IIS with rollback
        shell: powershell
        env:
          BEEDAY_PUBLIC_BASE_URL: ${{ secrets.BEEDAY_PUBLIC_BASE_URL }}
          BEEDAY_RESEND_API_KEY: ${{ secrets.BEEDAY_RESEND_API_KEY }}
          BEEDAY_RESEND_FROM_ADDRESS: ${{ secrets.BEEDAY_RESEND_FROM_ADDRESS }}
          BEEDAY_RESEND_FROM_NAME: ${{ secrets.BEEDAY_RESEND_FROM_NAME }}
          BEEDAY_ALLOWED_HOSTS: ${{ secrets.BEEDAY_ALLOWED_HOSTS }}
        run: |
          $publishPath = Join-Path "${{ runner.temp }}" "BeeDayPublish"

          & ".\scripts\Deploy-BeeDay.ps1" `
              -PublishPath $publishPath `
              -PublicBaseUrl $env:BEEDAY_PUBLIC_BASE_URL `
              -ResendApiKey $env:BEEDAY_RESEND_API_KEY `
              -ResendFromAddress $env:BEEDAY_RESEND_FROM_ADDRESS `
              -ResendFromName $env:BEEDAY_RESEND_FROM_NAME `
              -AllowedHosts $env:BEEDAY_ALLOWED_HOSTS
